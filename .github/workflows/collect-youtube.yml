name: collect-youtube

on:
  schedule:
    - cron: '7 19 * * *'  # 毎日 1 回(JST 04:07 頃)。50 名 ×100 units = 5,000/日 ≤ 無料枠 10,000
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update YouTube section and rebuild
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.youtube
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ out/
          if git diff --cached --quiet; then
            echo "変更なし — コミットしない"
          else
            git commit -m "data: youtube update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
